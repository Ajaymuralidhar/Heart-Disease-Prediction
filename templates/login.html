<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor Portal Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/login.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="container login-container">
        <div class="text-center mb-5">
            <h1 class="text-white fw-bold"><i class="bi bi-heart-pulse-fill"></i> CardioAI</h1>
            <p class="text-light opacity-75">Advanced ECG Analysis for Healthcare Professionals</p>
        </div>

        <div id="alert-container" class="mb-4">
            {% if error %}
                <div class="alert alert-danger shadow-sm rounded-3" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
                </div>
            {% endif %}
        </div>

        <div class="row justify-content-center">
            
            <div class="col-md-8 col-lg-6 {% if mode != 'login' %}d-none{% endif %}">
                <div class="auth-card">
                    <h3 class="text-primary"><i class="bi bi-door-open"></i> Doctor Login</h3>
                    <form id="loginForm">
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="login-email" placeholder="name@example.com" required>
                            <label for="login-email">Email address</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" class="form-control" id="login-password" placeholder="Password" required>
                            <label for="login-password">Password</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-3">Access Dashboard</button>
                    </form>
                    <div class="mt-4 text-center border-top pt-3">
                        <p class="small text-muted mb-1">New to the platform?</p>
                        <a href="/login?mode=signup" class="btn btn-outline-secondary btn-sm rounded-pill">Create Account</a>
                    </div>
                </div>
            </div>

            <div class="col-md-8 col-lg-6 {% if mode != 'signup' %}d-none{% endif %}">
                <div class="auth-card">
                    <h3 class="text-success"><i class="bi bi-person-plus"></i> Registration</h3>
                    <p class="text-muted text-center small mb-4">Secure access for medical personnel only.</p>
                    <form id="signupForm">
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="signup-email" placeholder="name@example.com" required>
                            <label for="signup-email">Email address</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" class="form-control" id="signup-password" placeholder="Password" required>
                            <label for="signup-password">Create Password (6+ chars)</label>
                        </div>
                        <button type="button" onclick="handleSignup()" class="btn btn-success w-100 py-3">Register Account</button>
                    </form>
                    <div class="mt-4 text-center border-top pt-3">
                        <p class="small text-muted mb-1">Already verified?</p>
                        <a href="/login?mode=login" class="btn btn-outline-primary btn-sm rounded-pill">Login Here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
        apiKey: "AIzaSyBmbkruLk2CHnyAPhlO6wRj4Trx1A6tfRc",
        authDomain: "heart-disease-91cbd.firebaseapp.com",
        projectId: "heart-disease-91cbd",
        storageBucket: "heart-disease-91cbd.firebasestorage.app",
        messagingSenderId: "607006461469",
        appId: "1:607006461469:web:ed570096f03e3a62b040f4",
        measurementId: "G-QQFVZ2NEQR"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        function showAlert(message, type = 'danger') {
            const container = document.getElementById('alert-container');
            container.innerHTML = `<div class="alert alert-${type} shadow-sm" role="alert"><i class="bi bi-info-circle-fill me-2"></i> ${message}</div>`;
        }
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            showAlert('Authenticating...', 'info'); 
            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => userCredential.user.getIdToken())
                .then((idToken) => {
                    const form = new FormData();
                    form.append('id_token', idToken);
                    return fetch('/login', { method: 'POST', body: form });
                })
                .then(response => {
                    if (response.redirected) window.location.href = response.url;
                    else response.text().then(text => showAlert('Login failed: ' + text));
                })
                .catch((error) => showAlert(error.message));
        });
        
        function handleSignup() {
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            if (password.length < 6) { showAlert('Password too short.', 'warning'); return; }
            auth.createUserWithEmailAndPassword(email, password)
                .then(() => showAlert('Account created! Please login.', 'success'))
                .catch((error) => showAlert(error.message));
        }
    </script>
</body>
</html>
