<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
      .admin-card { border-left: 4px solid var(--primary-color); }
  </style>
</head>
<body>
  
  <div class="container mt-4">
    <div class="card p-4 mb-4 bg-primary text-white shadow-lg border-0">
      <div class="d-flex justify-content-between align-items-center">
        <div>
           <h2 class="text-white mb-0"><i class="bi bi-shield-lock-fill"></i> Admin Portal</h2>
           <p class="mb-0 opacity-75">System Management & Oversight</p>
        </div>
        <a href="/logout" class="btn btn-light text-primary fw-bold">Logout</a>
      </div>
    </div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card p-4 admin-card h-100">
                <h5 class="text-secondary">Data Management</h5>
                <p class="small text-muted">Access full database records.</p>
                <a href="/history" class="btn btn-outline-primary w-100 mt-auto">
                    <i class="bi bi-table me-2"></i> Full Patient History
                </a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-4 admin-card h-100">
                <h5 class="text-secondary">User View</h5>
                <p class="small text-muted">View the system as a doctor.</p>
                <a href="/dashboard" class="btn btn-outline-success w-100 mt-auto">
                    <i class="bi bi-eye me-2"></i> Doctor Dashboard
                </a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-4 admin-card h-100">
                <h5 class="text-secondary">System Health</h5>
                <div class="d-flex align-items-center mt-3">
                    <div class="spinner-grow text-success spinner-grow-sm me-2" role="status"></div>
                    <span class="text-success fw-bold">Online</span>
                </div>
                <p class="small text-muted mt-2">Database Connected.<br>Model Loaded.</p>
            </div>
        </div>
    </div>
  </div>
</body>
</html>
