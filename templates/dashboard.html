<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doctor Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-5">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="#">
        <i class="bi bi-heart-pulse-fill"></i> CardioAI
      </a>
      <div class="d-flex">
        <span class="navbar-text me-3">Dr. Logged In</span>
        <a href="/logout" class="btn btn-outline-danger btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="text-center mb-5">
      <h2 class="fw-bold">Doctor Dashboard</h2>
      <p class="text-muted">Manage patient diagnostics and review history.</p>
    </div>

    <div class="row justify-content-center g-4">
      <div class="col-md-5">
        <div class="card h-100 text-center p-5">
          <div class="display-4 text-primary mb-3"><i class="bi bi-file-earmark-medical"></i></div>
          <h3 class="card-title">Analyze New ECG</h3>
          <p class="card-text text-muted mb-4">Upload a new ECG image to run the AI diagnostic model.</p>
          <a href="/analyze" class="btn btn-primary w-100 stretched-link">Start Analysis</a>
        </div>
      </div>

      <div class="col-md-5">
        <div class="card h-100 text-center p-5">
          <div class="display-4 text-secondary mb-3"><i class="bi bi-journal-medical"></i></div>
          <h3 class="card-title">Patient History</h3>
          <p class="card-text text-muted mb-4">View past records, diagnoses, and AI predictions.</p>
          <a href="/history" class="btn btn-outline-secondary w-100 stretched-link">View Records</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
