<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome to CardioAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .hero-section {
            height: 100vh;
            display: flex;
            align-items: center;
            background: url('/static/images/heart_bg2.jpg') no-repeat center center fixed; /* Ensure you have a nice medical background */
            background-size: cover;
            position: relative;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
        }
        .content-box {
            position: relative;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="hero-section">
        <div class="overlay"></div>
        <div class="container content-box">
            <div class="row justify-content-center">
                <div class="col-md-8 text-center">
                    <div class="mb-4 text-primary display-1">
                        <i class="bi bi-activity"></i>
                    </div>
                    <h1 class="display-4 fw-bold text-dark mb-3">CardioAI System</h1>
                    <p class="lead text-secondary mb-5">
                        State-of-the-art AI diagnostics for early heart disease detection using Electrocardiograms.
                    </p>

                    <div class="d-flex justify-content-center gap-3">
                        <a href="/login?mode=login" class="btn btn-primary btn-lg px-5 py-3 shadow-lg">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Doctor Login
                        </a>
                        <a href="/login?mode=signup" class="btn btn-outline-primary btn-lg px-5 py-3">
                            <i class="bi bi-clipboard-plus me-2"></i> Sign Up
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
